# Production-specific properties for platforms like Render

# Use a file-based H2 database in the /tmp directory, which is usually writable
spring.datasource.url=jdbc:h2:file:/tmp/tripwithus_prod_db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update