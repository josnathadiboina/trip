<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TripWithUs — Booking History | All Your Trips</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-active="history.html">
<nav class="navbar" id="siteNavbar"></nav>

<header class="hero" style="padding:36px 0 70px;">
  <div class="container">
    <span class="eyebrow">My Account</span>
    <h1 style="font-size:28px;">Booking History</h1>
    <p class="muted" style="margin-top:6px;">All your trips, stays and rides in one place.</p>
  </div>
</header>

<div class="container">
  <!-- Filters -->
  <div class="search-card" style="padding:20px 24px; margin-bottom:20px;">
    <div class="flex-between" style="flex-wrap:wrap; gap:12px; align-items:center;">
      <div class="flex gap-8" style="flex-wrap:wrap;">
        <input type="text" id="historySearch" placeholder="Search by city / booking id..." style="padding:10px 14px; border-radius:10px; border:1.5px solid var(--border); font-size:14px; min-width:220px;">
        <select id="historyTypeFilter" style="padding:10px 14px; border-radius:10px; border:1.5px solid var(--border); font-size:14px;" onchange="applyFilters()">
          <option value="">All Types</option>
          <option value="BUS">Bus</option>
          <option value="CAR">Car</option>
          <option value="TRAIN">Train</option>
          <option value="FLIGHT">Flight</option>
          <option value="HOTEL">Hotel</option>
        </select>
      </div>
      <div class="muted" id="historyCount" style="font-size:13px;"></div>
    </div>
  </div>

  <!-- Results -->
  <div id="historyList" class="loader">Loading your bookings...</div>
</div>

<footer id="siteFooter"></footer>

<script src="js/api.js"></script>
<script src="js/mock-api.js"></script>
<script src="js/common.js"></script>
<script src="js/history.js"></script>
<script>requireAuth();</script>
</body>
</html>
