<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TripWithUs — My Profile | Your Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-active="profile.html">
<nav class="navbar" id="siteNavbar"></nav>

<header class="hero" style="padding:36px 0 70px;">
  <div class="container">
    <span class="eyebrow">My Account</span>
    <h1 style="font-size:28px;">Profile</h1>
  </div>
</header>

<div class="container">
  <div class="search-card" style="padding:28px;">
    <div class="flex-between mb-16" style="flex-wrap:wrap; gap:10px;">
      <h3>Personal Details</h3>
      <button class="btn btn-outline btn-sm" id="editToggleBtn" onclick="toggleEdit()">Edit Profile</button>
    </div>
    <div class="grid grid-2" id="profileView"></div>
    <form id="profileEditForm" class="hidden mt-16">
      <div class="grid grid-2">
        <div class="form-group"><label>Name</label><input type="text" id="editName"></div>
        <div class="form-group"><label>Age</label><input type="number" id="editAge"></div>
        <div class="form-group"><label>Email</label><input type="email" id="editEmail"></div>
        <div class="form-group"><label>Location</label><input type="text" id="editLocation"></div>
      </div>
      <button type="submit" class="btn btn-primary">Save Changes</button>
      <p class="success-text" id="editMsg"></p>
    </form>
  </div>

  <!-- Tabs -->
  <div class="mode-tabs section-tight">
    <button class="mode-tab active" onclick="showTab('bookings', this)">My Bookings</button>
    <button class="mode-tab" onclick="showTab('refunds', this)">Refunds</button>
    <button class="mode-tab" onclick="showTab('recommendations', this)">Recommended for You</button>
    <button class="mode-tab" onclick="showTab('issues', this)">Support Tickets</button>
  </div>

  <section id="tab-bookings" class="section-tight">
    <div id="bookingsList" class="loader">Loading your bookings...</div>
  </section>

  <section id="tab-refunds" class="section-tight hidden">
    <div id="refundsList" class="loader">Loading refunds...</div>
  </section>

  <section id="tab-recommendations" class="section-tight hidden">
    <div class="flex-between mb-16">
      <p class="muted" style="margin:0;">Personalized suggestions based on your booking history</p>
      <button class="btn btn-outline btn-sm" onclick="loadRecommendations(true)">🔄 Refresh Recommendations</button>
    </div>
    <div id="recoList" class="grid grid-3"></div>
  </section>

  <section id="tab-issues" class="section-tight hidden">
    <div class="card mb-16">
      <h4 class="mb-16">Raise a Support Ticket</h4>
      <form id="issueForm">
        <div class="form-group"><label>Subject</label><input type="text" id="issueSubject" required></div>
        <div class="form-group"><label>Description</label><textarea id="issueDescription" rows="3" required></textarea></div>
        <button class="btn btn-primary" type="submit">Submit Ticket</button>
      </form>
    </div>
    <div id="issuesList"></div>
  </section>

  <!-- Logout at bottom of Profile page -->
  <div class="text-center" style="padding:40px 0 56px;">
    <button class="btn btn-outline" onclick="logout()" style="padding:14px 48px; border-color:var(--danger); color:var(--danger); font-weight:600; font-size:16px;">
      🚪 Logout
    </button>
    <p class="muted mt-8" style="font-size:12px;">Sign out of your account</p>
  </div>
</div>

<footer id="siteFooter"></footer>

<script src="js/api.js"></script>
<script src="js/mock-api.js"></script>
<script src="js/common.js"></script>
<script src="js/profile.js"></script>
<script>requireAuth();</script>
</body>
</html>
