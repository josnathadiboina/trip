services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: trip-with-us:latest
    container_name: trip-with-us
    ports:
      - "8080:8080"
    environment:
      # Overrides come from application.properties defaults; set anything
      # you want to externalize here (e.g. DB, JWT secret in production).
      - SERVER_PORT=8080
      # - APP_JWT_SECRET=change-me-in-production
      # - APP_JWT_EXPIRATION_MS=86400000
    restart: unless-stopped
