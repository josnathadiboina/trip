<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — TRIP-WITH-US</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div class="logo">TRIP<span class="dot">•</span>WITH<span class="dot">•</span>US</div>
    <p class="auth-sub">Log in to book your next journey</p>

    <form id="loginForm">
      <div class="form-group">
        <label>Mobile Number (or Admin Username)</label>
        <input type="text" id="username" placeholder="e.g. 9876543210" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
      <p class="error-text" id="errText"></p>
    </form>

    <p class="auth-switch">No Account? <a href="signup.html">Sign Up</a></p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script>
// Check if already logged in - redirect to home
if (getToken()) {
  try {
    var saved = JSON.parse(localStorage.getItem('twu_session') || '{}');
    if (saved.role === 'ADMIN') {
      window.location.href = 'admin.html';
    } else {
      window.location.href = 'home.html';
    }
  } catch(e) {
    // Continue to login page
  }
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('errText');
  errEl.style.display = 'none';
  try {
const auth = await post('/auth/login', {
      username: document.getElementById('username').value.trim(),
      password: document.getElementById('password').value
    });
    saveSession(auth);
    window.location.href = auth.role === 'ADMIN' ? 'admin.html' : 'home.html';
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
  }
});
</script>
</body>
</html>
