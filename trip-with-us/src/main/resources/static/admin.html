<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — TRIP-WITH-US</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
  <div class="nav-inner">
    <a href="admin.html" class="logo">TRIP<span class="dot">•</span>WITH<span class="dot">•</span>US <span class="muted" style="font-size:12px; margin-left:6px;">ADMIN</span></a>
    <div class="nav-right">
      <span class="profile-pill"><span class="avatar">A</span> Administrator</span>
      <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
    </div>
  </div>
</nav>

<header class="hero" style="padding:36px 0 60px;">
  <div class="container">
    <span class="eyebrow">Control Center</span>
    <h1 style="font-size:28px;">Admin Dashboard</h1>
  </div>
</header>

<div class="container">
  <div class="grid grid-4 section-tight" id="summaryCards"></div>

  <div class="mode-tabs section-tight">
    <button class="mode-tab active" onclick="showAdminTab('availability', this)">Availability</button>
    <button class="mode-tab" onclick="showAdminTab('issues', this)">Issues</button>
    <button class="mode-tab" onclick="showAdminTab('coupons', this)">Coupons</button>
    <button class="mode-tab" onclick="showAdminTab('bookings', this)">Bookings</button>
    <button class="mode-tab" onclick="showAdminTab('refunds', this)">Refunds</button>
    <button class="mode-tab" onclick="showAdminTab('reviews', this)">Flagged Reviews</button>
  </div>

  <!-- Availability -->
  <section id="admin-availability" class="section-tight">
    <div class="mode-tabs">
      <button class="mode-tab active" onclick="showFleet('buses', this)">🚌 Buses</button>
      <button class="mode-tab" onclick="showFleet('cars', this)">🚗 Cars</button>
      <button class="mode-tab" onclick="showFleet('trains', this)">🚆 Trains</button>
      <button class="mode-tab" onclick="showFleet('flights', this)">✈️ Flights</button>
      <button class="mode-tab" onclick="showFleet('hotels', this)">🏨 Hotels</button>
    </div>

    <!-- Add New Item Form -->
    <div class="card mb-16" id="addFormContainer">
      <h4 class="mb-16" id="addFormTitle">Add New Bus</h4>
      <form id="addItemForm">
        <div class="grid grid-3" id="addFormFields">
          <!-- Fields dynamically populated by JS -->
        </div>
        <button class="btn btn-primary mt-16" type="submit">Add New Item</button>
        <p class="success-text" id="addItemMsg"></p>
      </form>
    </div>

    <div id="fleetList" class="loader">Loading...</div>
  </section>

  <!-- Issues -->
  <section id="admin-issues" class="section-tight hidden">
    <div id="issuesAdminList" class="loader">Loading...</div>
  </section>

  <!-- Coupons -->
  <section id="admin-coupons" class="section-tight hidden">
    <div class="card mb-16">
      <h4 class="mb-16">Create Festival Coupon</h4>
      <form id="couponForm">
        <div class="grid grid-2">
          <div class="form-group"><label>Code</label><input type="text" id="couponCodeInput" placeholder="e.g. HOLI2026" required></div>
          <div class="form-group"><label>Discount %</label><input type="number" id="couponDiscount" min="1" max="90" required></div>
          <div class="form-group"><label>Valid From</label><input type="date" id="couponFrom" required></div>
          <div class="form-group"><label>Valid To</label><input type="date" id="couponTo" required></div>
        </div>
        <div class="form-group"><label>Description</label><input type="text" id="couponDesc" placeholder="e.g. Holi festival special discount"></div>
        <button class="btn btn-primary" type="submit">Create Coupon</button>
      </form>
    </div>
    <div id="couponsAdminList" class="loader">Loading...</div>
  </section>

  <!-- Bookings -->
  <section id="admin-bookings" class="section-tight hidden">
    <div id="bookingsAdminList" class="loader">Loading...</div>
  </section>

  <!-- Refunds -->
  <section id="admin-refunds" class="section-tight hidden">
    <div id="refundsAdminList" class="loader">Loading...</div>
  </section>

  <!-- Flagged reviews -->
  <section id="admin-reviews" class="section-tight hidden">
    <div id="reviewsAdminList" class="loader">Loading...</div>
  </section>
</div>

<footer id="siteFooter">
  <div class="container">© 2026 TRIPWITHUS (INDIA) PRIVATE LIMITED. All rights reserved</div>
</footer>

<script src="js/api.js"></script>
<script src="js/mock-api.js"></script>
<script src="js/common.js"></script>
<script src="js/admin.js"></script>
<script>requireAdmin();</script>
</body>
</html>
