spring.application.name=trip-with-us

# --- H2 in-memory database (swap for MySQL/Postgres in production) ---
spring.datasource.url=jdbc:h2:mem:tripwithus;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=8080

# --- App / JWT config ---
app.jwt.secret=TripWithUsSuperSecretKeyForJWTSigning2026ChangeInProduction!!
app.jwt.expiration-ms=86400000

# --- Admin bootstrap credentials ---
app.admin.username=Hanuma
app.admin.password=Hanuma@387

logging.level.org.springframework.security=INFO
