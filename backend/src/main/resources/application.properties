# ===================================================================
# Spring Boot application configuration file.
#
# This file contains the default configuration for local development.
# Production-specific overrides can be found in application-prod.properties.
# ===================================================================

# SERVER
# Use the PORT environment variable if set (for platforms like Render),
# otherwise default to 8080 for local development.
server.port=${PORT:8080}

# DATABASE (H2 in-memory for local dev)
spring.datasource.url=jdbc:h2:mem:tripwithus_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop