spring.application.name=trip-with-us

# ============================================================
# TRIPWITHUS backend config (env-driven with local dev defaults)
# ============================================================
# Server
server.port=${BACKEND_PORT:8080}

# --- H2 in-memory database (swap for MySQL/Postgres in production) ---
# spring.datasource.url=jdbc:h2:mem:tripwithus;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=${DB_USERNAME:sa}
# spring.datasource.password=${DB_PASSWORD:}
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# --- PostgreSQL database ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- App / JWT config (override via environment) ---
app.jwt.secret=${JWT_SECRET:TripWithUsSuperSecretKeyForJWTSigning2026ChangeInProduction!!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Admin bootstrap credentials ---
app.admin.username=${ADMIN_USERNAME:joo}
app.admin.password=${ADMIN_PASSWORD:joo@123}

# --- Static frontend serving (folder containing index.html + css/js) ---
# Leave empty to auto-detect relative to the working directory (frontend/ or ../frontend).
app.static.frontend-dir=${FRONTEND_DIR:}

logging.level.org.springframework.security=INFO
