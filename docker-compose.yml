# ============================================================
# TripWithUs — full-stack deployment (frontend + backend)
# ============================================================
version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tripwithus-backend
    restart: unless-stopped
    environment:
      BACKEND_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-TripWithUsSuperSecretKeyForJWTSigning2026ChangeInProduction!!}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-joo}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-joo@123}
      DB_USERNAME: ${DB_USERNAME:-sa}
      DB_PASSWORD: ${DB_PASSWORD:-}
    ports:
      - "8080:8080"
    networks:
      - tripwithus-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tripwithus-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - tripwithus-net

networks:
  tripwithus-net:
    driver: bridge

